<html>
    <head>
        <title>Latihan 1</title>
    </head>
    <body>
        <h1>latihan HTML</h1>
        <table border="1" width="300">
            <tr>
                <th>X</th>
                <th>A</th>
                <th>B</th>
            </tr>
            <tr>
                <th>D</th>
                <th>AD</th>
                <th>BD</th>
            </tr>
            <tr>
                <th>C</th>
                <th>AC</th>
                <th>CB</th>
            </tr>
            <tr>
                <th>E</th>
                <th>AE</th>
                <th>EB</th>
            </tr>
        </table>
        <hr>
        <!--rowspon = gabung garis colspan = gabung kolom-->
        <table border="1" width="300">
            <tr>
                <th>X</th>
                <th>5</th>
                <th>8</th>
            </tr>
            <tr>
                <th>7</th>
                <th>35</th>
                <th>56</th>
            </tr>
            <tr>
                <th>6</th>
                <th>38</th>
                <th>48</th>
            </tr>
            <tr>
                <th>8</th>
                <th>48</th>
                <th>64</th>
            </tr>
        </table>
        <hr>
        <table width="300" border="1" height="100">
            <tr align="center">
                <td colspan="2">1, 2</td>
                <td colspan="2">3, 4</td>
            </tr>
            <tr align="center">
                <td>5</td>
                <td>6</td>
                <td>7</td>
                <td>8</td>
            </tr>
            <tr align="center">
                <td colspan="4">9,10,11,12</td>
            </tr>
        </table>
        <hr>
        <table width="300" border="1" height="100">
            <tr align="center">
                <td rowspan="4"> 1, <br> 4, <br> 7, <br> 10</td>
                <td width="100">2</td>
                <td width="100">3</td>
            </tr>
            <tr align="center">
                <td>5</td>
                <td rowspan="2">2, 9</td>
            </tr>
            <tr align="center">
                <td>8</td>
            </tr>
            <tr align="center">
                <td>11</td>
                <td>12</td>
            </tr>
        </table>
    </body>
</html>
